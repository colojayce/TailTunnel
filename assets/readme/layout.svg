<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="layout-title layout-desc">
  <title id="layout-title">TailTunnel 的隧道模型：一次 ssh -L 连接承载多条本地转发</title>
  <desc id="layout-desc">同一次 SSH 连接上建立两条本地转发：本地 5432 端口映射到远程主机的 127.0.0.1:5432，本地 6379 端口映射到远程网络中的 10.0.3.4:6379。</desc>

  <rect width="1200" height="420" rx="28" fill="#f6f7f9"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="76" fill="#6b7280" font-size="18">隧道模型 &#183; 一条隧道对应一次 ssh -L</text>
    <text x="64" y="122" fill="#1f2430" font-size="36" font-weight="700">一次 SSH 连接，多条本地转发</text>
  </g>

  <!-- 本机 -->
  <g id="local" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="168" width="300" height="196" rx="14" fill="#ffffff" stroke="rgba(47,42,34,0.10)"/>
    <text x="88" y="206" fill="#6b7280" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16">本地</text>
    <rect x="88" y="228" width="252" height="48" rx="9" fill="#f1f3f6"/>
    <text x="214" y="259" fill="#1f2430" font-size="20" font-weight="650" text-anchor="middle">localhost:5432</text>
    <rect x="88" y="290" width="252" height="48" rx="9" fill="#f1f3f6"/>
    <text x="214" y="321" fill="#1f2430" font-size="20" font-weight="650" text-anchor="middle">localhost:6379</text>
  </g>

  <!-- 连接 -->
  <g id="link" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <line x1="380" y1="252" x2="604" y2="252" stroke="#3462ad" stroke-width="2"/>
    <path d="M596 246l12 6-12 6z" fill="#3462ad"/>
    <line x1="380" y1="314" x2="604" y2="314" stroke="#3462ad" stroke-width="2"/>
    <path d="M596 308l12 6-12 6z" fill="#3462ad"/>
    <rect x="430" y="268" width="124" height="30" rx="8" fill="#3462ad"/>
    <text x="492" y="288" fill="#ffffff" font-size="16" font-weight="650" text-anchor="middle">ssh -L</text>
  </g>

  <!-- 远端 -->
  <g id="remote" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="620" y="168" width="516" height="196" rx="14" fill="#ffffff" stroke="rgba(47,42,34,0.10)"/>
    <text x="644" y="206" fill="#6b7280" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16">远程主机 &#183; deploy@100.64.1.2</text>
    <rect x="644" y="228" width="468" height="48" rx="9" fill="#f1f3f6"/>
    <text x="878" y="259" fill="#1f2430" font-size="20" font-weight="650" text-anchor="middle">127.0.0.1:5432</text>
    <rect x="644" y="290" width="468" height="48" rx="9" fill="#f1f3f6"/>
    <text x="878" y="321" fill="#1f2430" font-size="20" font-weight="650" text-anchor="middle">10.0.3.4:6379</text>
  </g>
</svg>
