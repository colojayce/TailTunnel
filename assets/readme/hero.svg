<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">TailTunnel</title>
  <desc id="hero-desc">TailTunnel 的主界面：左侧为导航，中间是隧道列表，每条隧道显示本地端口到远程地址的映射和运行状态，底部终端面板显示所选隧道的 ssh 输出。</desc>

  <rect width="1200" height="460" rx="28" fill="#f6f7f9"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="168" fill="#6b7280" font-size="20">macOS &#183; SSH Local Port Forwarding</text>
    <text x="64" y="236" fill="#1f2430" font-size="64" font-weight="700">TailTunnel</text>
    <text x="64" y="286" fill="#1f2430" font-size="24">SSH 本地端口转发管理工具</text>
    <text x="64" y="320" fill="#1f2430" font-size="24">集中管理多条隧道及其日志</text>
  </g>

